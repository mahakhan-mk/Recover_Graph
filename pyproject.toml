[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-swarm"
version = "0.1.0"
description = "RecoverGraph: outcome-verified recovery experience for LLM coding agents."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "packaging>=24.0",
  "datasets>=4.0",
  "huggingface-hub",
  "neo4j>=6.2",
  "pydantic>=2",
  "pydantic-ai-slim[openai]==2.31.1",
  "pydantic-ai-harness==0.22.0",
  "pydantic-evals==2.31.1",
  "pydantic-settings>=2",
  "sentence-transformers==5.7.0",
  "PyYAML>=6",
  "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
  "pyright",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_swarm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an explicitly enabled live Neo4j instance"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

experiment_id: GS-E003
protocol_revision: sprint3b-kilo-reduced-b0-t-v4-prompt-canary
rollout: track_b_reduced_development_pilot
config_version: sprint3b-kilo-v4-prompt-canary
development: true
pilot: true

model_config: configs/models/kilo_coding.yaml
provider: kilo
model: nex-agi/nex-n2.5-pro
model_source: Kilo paid Nex-N2.5-Pro coding-model transport
model_source_evidence:
  - configs/models/kilo_coding.yaml
  - src/graph_swarm/agent/coding_agent.py
  - src/graph_swarm/settings.py
model_resolution_variable: KILO_CODING_MODEL
model_validation: exact_match_required_before_execution
model_settings:
  temperature: 0
  reasoning: null
prompt_version: v1
system_prompt: R13B_SYSTEM_PROMPT
system_prompt_sha256: f3bf4187cc9bfabcf2551aa3988e592a2d0f2d0e61ad2984d7d90ddf13d54502
system_prompt_source: src/graph_swarm/agent/prompts.py

conditions: [B0, T]
task_manifest: benchmark/manifests/pilot.jsonl
task_problems: benchmark/annotations/recurrence_validation.csv
task_ids: [GS-T006, GS-T007, GS-T008]
task_order:
  - GS-T006
  - GS-T007
  - GS-T008
planned_primary_runs: 6
repetition_count: 1
execution_order: paired_task_major
execution_plan:
  - [GS-T006, B0]
  - [GS-T006, T]
  - [GS-T007, B0]
  - [GS-T007, T]
  - [GS-T008, B0]
  - [GS-T008, T]

limits:
  max_actions: 28
  max_requests: 24
  timeout_seconds: 300
  tool_retries: 3
  task_timeout_seconds: 300
  model_request_timeout_seconds: 300
  tool_timeout_seconds:
    run_command: 30
    run_tests: 120

development_protocol_rationale:
  provenance_only: true
  source: retained GS-E003 Sprint 3B v2 B0/T trajectories
  right_censored_trajectories: 20
  right_censoring_statement: all 20 retained B0/T trajectories were right-censored by the 20-call limit
  attempted_usage_count_max: 25
  attempted_usage_statement: retained UsageLimitExceeded evidence contained attempted usage counts up to 25
  observed_action_statement: 25 is an attempted usage count, not an observed 25-action executed trajectory
  headroom_calls: 3
  headroom_statement: 28 equals the maximum attempted usage count of 25 plus 3 predeclared calls of headroom
  applies_identically_to: [B0, T]
  edit_file_statement: the increase does not assume or guarantee that censored tasks will reach edit_file
pacing:
  min_request_start_interval_seconds: 5.0
  nominal_requests_per_minute: 12
tools:
  - read_file
  - write_file
  - edit_file
  - run_tests
  - run_command
tool_permissions:
  read_file: workspace_read_only
  write_file: workspace_write
  edit_file: workspace_write
  run_tests: controlled_workspace_process
  run_command: controlled_workspace_process
condition_runtime:
  B0:
    advisory_service: none
  T:
    advisory_service: AdvisoryService

objective_evaluator: frozen_swesmith_fail_to_pass
objective_evaluator_version: frozen_swesmith_objective_v1
recurrence_evaluator: frozen_fail_to_pass_recurrence_matcher
recurrence_evaluator_version: frozen_recurrence_matcher_v2_structured_pytest
recurrence_ground_truth_visibility: post_execution_evaluation_only

treatment_memory_policy: "fixed frozen acquisition corpus / read-only treatment memory"
treatment_repository: R13bTreatmentRepository
treatment_pattern_ids:
  - recovery-pattern-ad07a6a45718b848a30ad377
  - recovery-pattern-f490f62ab931191c6eac6db1
  - recovery-pattern-162e3999c4a2c66a1ff647ed
  - recovery-pattern-fd7b65022b22dc5f2a42816f
  - recovery-pattern-99a54266f940e1d4648f4698
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  backend: huggingface_hub.InferenceClient(provider=hf-inference)
  dimension: 384
  normalized: true
abstraction_model:
  provider: openrouter
  name: cohere/north-mini-code:free
  resolution_variable: OPENROUTER_ABSTRACTION_MODEL
  phase: acquisition_only
  used_during_transfer_execution: false
memory_writes: forbidden
online_learning: false
neo4j_write_policy: forbidden
neo4j_operations: [verify_connectivity, count_read_only, query_read_only, get_read_only]

artifact_root: research/evidence/results/GS-E003/sprint3b_kilo_v4_canary/runs
freeze_artifact: research/evidence/results/GS-E003/sprint3b_kilo_v4_canary/freeze.json
workspace_baseline_root: benchmark/workspaces
workspace_execution_root: research/evidence/workspaces
task_workspace_network: disabled
external_runtime_network:
  kilo: required
  huggingface_inference: required

rerun_policy:
  planned_primary_runs_per_task_condition: 1
  selective_reruns: forbidden
  allowed_only_for: documented_invalid_infrastructure_or_provider_failure
  preserve_invalid_artifact: true
  new_run_id_required: true
  document_reason_required: true
  replace_history: forbidden

metrics:
  primary:
    name: repeated_failure_rate
    numerator: known_recurring_failures_repeated
    denominator: opportunities_to_repeat_known_failures
    calculation_status: frozen_definition_only
  mandatory_safety:
    name: false_advice_rate
    numerator: incorrect_or_inapplicable_advice_events
    denominator: total_advice_events
    calculation_status: frozen_definition_only
  secondary:
    - task_success
    - advice_coverage
    - advice_accepted_behavior_changed
    - recovery_reuse_success
    - retries
    - tool_calls
    - token_usage_when_available
    - latency
    - retrieval_score
    - selected_pattern
    - precision_at_1_diagnostic

leakage_safeguards:
  allowed_retrieval_inputs:
    - Task.problem_statement
    - PlannedAction.current_action_data
    - EnvironmentContext
    - chronological_index_for_historical_filtering_only
  forbidden_retrieval_or_model_inputs:
    - family_id
    - family_label
    - mutation_family
    - expected_recovery
    - gold_patch
    - benchmark_labels
    - expected_solution
    - recurrence_ground_truth
    - future_task_metadata
    - evaluator_annotations
  evaluation_metadata_timing: post_execution_only

integration_point_1_sha: 169cf089b84f7a2df2e513ff393dbc629d77523e
r13b_freeze_sha: 857bd073de420d0129435e3bb47e96db3741ad4f
